# policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/tiangong_experiment/Apr17_17-27tiangong_training/model_1500.pt"
policy_path: "{LEGGED_GYM_ROOT_DIR}/logs/tiangong_experiment/exported/policies/policy_1.pt"
xml_path: "{LEGGED_GYM_ROOT_DIR}/resources/robots/tiangong/xml/tiangong.xml"
show_log_plot: True

# Total simulation time
simulation_duration: 20
# Simulation time step
simulation_dt: 0.001
# Controller update frequency (meets the requirement of simulation_dt * controll_decimation=0.02; 50Hz)
control_decimation: 10

# tiangong 14dof
kps: [200, 200, 250, 250, 80, 80, 50,
      200, 200, 250, 250, 80, 80, 50]
kds: [10, 10, 15, 15, 10, 5, 3,
      10, 10, 15, 15, 10, 5, 3]

default_angles: [0.0, 0.0, -0.35, 0.7, -0.35, 0.0,
                 0.0, 0.0, -0.35, 0.7, -0.35, 0.0,
                 0.0, 0.0]

lin_vel_scale: 2.0
ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.25
cmd_scale: [2.0, 2.0, 0.25]

# tiangong 14dof
num_actions: 14
num_obs: 51
cmd_init: [0.2, 0.0, 0]